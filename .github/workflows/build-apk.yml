name: Build DailyTracker APK

on:
  push:
    branches: [main, timer-dot-phases-and-nav-warmup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Load and verify permanent signing key
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL_FINGERPRINT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android 2>/dev/null | awk -F': ' '/SHA256:/{gsub(/:/, "", $2); print tolower($2); exit}')
          EXPECTED_FINGERPRINT="ce52869bcaee870060f44df125e79f6079e9e67e3a69fdf1ecb926b9cd381c94"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Configured keystore fingerprint does not match the expected signing identity."
            exit 1
          fi
          echo "Permanent signing keystore fingerprint verified."
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Sign and verify APK
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="app/build/outputs/apk/debug/app-debug-signed.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -s "$APK" ]; then
            echo "::error::Built APK not found or empty: $APK"
            exit 1
          fi
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found at $APKSIGNER"
            exit 1
          fi
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Verified signing keystore is missing: $KEYSTORE"
            exit 1
          fi

          # Re-sign explicitly with the verified key instead of relying on
          # Gradle's implicit debug-keystore selection.
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$APK"
          mv "$SIGNED_APK" "$APK"

          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/{print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_FINGERPRINT="ce52869bcaee870060f44df125e79f6079e9e67e3a69fdf1ecb926b9cd381c94"

          if [ -z "$ACTUAL_FINGERPRINT" ]; then
            echo "::error::Could not read the APK signing certificate SHA-256 fingerprint."
            exit 1
          fi
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::APK signing certificate does not match the permanent DailyTracker key."
            exit 1
          fi
          echo "APK signature verified against the permanent signing identity."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyTracker-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-build-${{ github.run_number }}
          name: DailyTracker Stable Build #${{ github.run_number }}
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
